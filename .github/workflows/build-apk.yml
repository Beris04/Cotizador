name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'src/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Mostrar versiones
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar web móvil
        run: npm run build:web

      - name: Crear proyecto Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generar iconos Android
        run: npm run android:assets

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Verificar proyecto Android
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Proyecto Android listo"

      - name: Compilar APK Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v6
        with:
          name: Toyo-Foods-Comercial-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
